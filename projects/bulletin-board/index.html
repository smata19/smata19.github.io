<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <div class="post-it">
                <ul>
                    Grocery List
                    <li>Milk</li>
                    <li>Eggs</li>
                    <li>Coffee</li>
                </ul>
            </div>

            <div class="post-it">
                <h2> Saturday, MOM'S BIRTHDAY!</h2>
            </div>

            <div class="post-it">
                <p>
                    Amelia's Dr. appointment, 9/21 
                    <span id="color">@10am</span>
                </p>
            </div>
            <br>
            &nbsp; &nbsp;
            <div class="post-it">
                <img
                    src="images/graduation-invite.png"
                    alt="invite"
                    width="100"
                >
            </div>

            <div class="post-it">
                <h1>LABOR DAY WEEKEND</h1>
            </div>

            <div class="post-it">
                <p>Register to <span id="vote">VOTE!!!!!!!!</span></p>
            </div>
        </div>
    </body>
</html>
