<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Showcase Site Project</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="column-1">
            <div class="container">
                <h3>Best Sellers</h3>
                <img
                    src="images/cover.webp"
                    alt="cover"
                >
                <h1>STARFACE</h1>
                <p>Orders over $50 get free shipping!</p>
                <a href="#" class="button first">Sign Up</a>
            </div>
        </div>
        <div class="column-2">
            <div class="container">
                <h2>Big Blue</h2>
                <img
                    src="images/big-blue.webp"
                    alt="blue case"
                >
                <p>32 saliculic acid blue-patches</p>
                <b id="red">SOLD OUT</b>
                <h5>Hydro Stars</h5>
                <a href="#" class="button second">Add to Cart</a>
            </div>
        </div>
        <div class="column-3">
            <div class="container">
                <h2>Black Star</h2>
                <img
                    src="images/black-patches.webp"
                    alt="black stars"
                >
                <p>32 saliculic acid black-patches</p>
                <h5>Hydro Stars</h5>
                <a href="#" class="button third">Add to Cart</a>
            </div>
        </div>
    </body>
</html>
