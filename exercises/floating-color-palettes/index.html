<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2 id="title">Winter</h2>
            <h4 class="color" id="cp1c1">CCDBDC</h4>
            <h4 class="color" id="cp1c2">80CED7</h4>
            <h4 class="color" id="cp1c3">63C7B2</h4>
        </div>
        <br>
        <div class="color-palette">
            <h2 id="style">Fall</h2>
            <h4 class="color" id="cp2c1">EEE0CB</h4>
            <h4 class="color" id="cp2c2">BAA898</h4>
            <h4 class="color" id="cp2c3">848586</h4>
        </div>
        <br>
        <div class="color-palette">
            <h2 id="header">Summer</h2>
            <h4 class="color" id="cp3c1">F0CF65</h4>
            <h4 class="color" id="cp3c2">D7816A</h4>
            <h4 class="color" id="cp3c3">BD4F6C</h4>
        </div>
    </body>
</html>
