<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <ul>
            <li>This is a list item element</li>
            <li>cereal</li>
            <li>eggs</li>
            <li>milk</li>
        </ul>
        This is text outside of the list.
        <h2>Rankings</h2>
        <ol>
            <li>
                <b>This is another list item</b>
            </li>
            <li>dino nuggets</li>
            <li>ice cream</li>
        </ol>
    </body>
</html>
